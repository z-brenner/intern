[package]
name = "intern-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "intern-worker"
path = "src/main.rs"

# Calibrates the PDF page router; it reads PDFs, so it needs PDFium.
[[example]]
name = "route_calibration"
required-features = ["native-pdfium"]

[features]
default = []
native-pdfium = ["dep:pdfium-render"]
native-tesseract = []
# PP-OCR through ONNX Runtime, loaded at run time from the runtime directory.
# Nothing is linked or downloaded at build time, so a build without the
# runtime beside it falls back to Tesseract exactly as before.
onnx-ocr = ["dep:ort"]
windows-native = ["native-pdfium", "native-tesseract", "onnx-ocr"]

[dependencies]
anydoc = "=0.1.8"
base64 = "=0.22.1"
calamine = "=0.36.1"
cfb = "=0.10.0"
codepage = "=0.1.2"
csv = "=1.4.0"
encoding_rs = "=0.8.35"
jiff = "=0.2.35"
mailparse = "=0.16.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
pdfium-render = { version = "=0.9.3", optional = true, default-features = false, features = ["image_025", "pdfium_7881", "thread_safe"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
msg_parser = "=0.3.6"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic"] }

[dev-dependencies]
intern-core = { path = "../intern-core" }
intern-intake = { path = "../intern-intake" }
tempfile = "=3.23.0"
