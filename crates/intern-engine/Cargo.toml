[package]
name = "intern-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "intern-analyze"
path = "src/bin/intern-analyze.rs"

[[bin]]
name = "intern-evaluate"
path = "src/bin/intern-evaluate.rs"

[dependencies]
base64 = "=0.22.1"
# A hosted service's Retry-After may be an HTTP-date. Already built for
# intern-intake with exactly these features, so it costs no compilation.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
fs4 = "=0.13.1"
rand = "=0.8.5"
# Both root sets: the bundled Mozilla roots, and the operating system's store.
# A firm that inspects TLS installs its own root in the Windows store by
# policy, and with the bundled roots alone the model download and a hosted
# model failed behind it with nothing saying why. The union matters: the
# bundled set still covers roots Windows has not fetched yet.
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.45.1", features = ["macros", "rt", "time"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.24"

# A job object is the only way to make llama-server and the parser worker die
# with Intern however Intern ends - `std::process::exit`, a panic, or a crash -
# and there is no safe wrapper for it in the tree. Pinned exactly, and already
# built as a transitive dependency of Tauri, so it costs no extra compilation.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# A throwaway HTTPS server for tests/native_roots.rs, at the versions reqwest
# already locks. Ring only: it is the provider reqwest is built with.
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.15.1"
tempfile = "=3.23.0"
