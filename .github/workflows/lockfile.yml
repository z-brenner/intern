name: Rust lock and format check

# A gate, not a generator. This used to run `cargo generate-lockfile`, which
# ignores the committed Cargo.lock and resolves the newest compatible
# versions, and `cargo fmt` without --check, and then uploaded both as an
# artifact: it could not fail on lock drift or on formatting, so its green
# check suggested a verification that never happened. Now a manifest change
# the committed lock does not satisfy fails here, in seconds, and so does
# unformatted code.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/*.rs"
      - .github/workflows/lockfile.yml

permissions:
  contents: read

jobs:
  check:
    name: Rust lock and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Require the committed lock to satisfy every manifest
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all -- --check
