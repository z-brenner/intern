name: Clef-Flash load diagnosis

# One-off, on this branch only: finds llama-server flags that load Clef-Flash on a CPU runner
# (the first screen aborted in ggml_backend_sched_split_graph while reserving the graph).
on:
  push:
    branches: [claude/project-thread-uushfr]
    paths: [.github/workflows/clef-flash-diag.yml]

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: d35dc4d9e6827db8e08426a2340d8a71ea863cd9
  GGUF_URL: https://huggingface.co/ggml-org/Clef-Flash-GGUF/resolve/main/Clef-Flash-Q4_K_M.gguf

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build llama-server
        run: |
          set -euo pipefail
          git init -q llama.cpp && cd llama.cpp
          git fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$LLAMA_CPP_COMMIT"
          git checkout -q FETCH_HEAD
          cmake -B build -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build --target llama-server -j 4 > build.log 2>&1 || (tail -50 build.log; exit 1)
      - name: Download Clef-Flash
        run: curl -sSL --retry 4 -o clef.gguf "$GGUF_URL" && ls -la clef.gguf
      - name: Try flag sets
        run: |
          head -1 bench/reports/clef-flash-2026-11/requests.jsonl | python3 -c "import json,sys; q=json.load(sys.stdin); print(json.dumps(q['request']))" > one.json
          try() {
            echo "=================== $*"
            ./llama.cpp/build/bin/llama-server -m clef.gguf -t 4 -np 1 --host 127.0.0.1 --port 8080 "$@" > s.log 2>&1 &
            P=$!
            ok=0
            for i in $(seq 1 60); do
              if ! kill -0 $P 2>/dev/null; then break; fi
              if curl -sf http://127.0.0.1:8080/health > /dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ $ok = 1 ]; then
              /usr/bin/time -f "request %e s" curl -s -m 900 http://127.0.0.1:8080/v1/systemone -H 'Content-Type: application/json' -d @one.json | head -c 1500; echo
            else
              echo "DID NOT LOAD"; grep -n "GGML_ASSERT\|error\|failed" s.log | head -8
            fi
            grep -n "decision\|n_ubatch\|flash_attn\|compute buffer" s.log | head -12
            kill $P 2>/dev/null; wait $P 2>/dev/null; sleep 2
          }
          try -nr -c 8192 -b 8192 -ub 8192
          try -nr -c 8192 -b 8192 -ub 8192 -fa off
