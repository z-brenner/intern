name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or branch) at a time. A new push to a pull request
# makes its running checks obsolete, so they are cancelled rather than left to
# hold a Windows runner for half an hour. On main nothing in progress is
# cancelled: a run always finishes, and of the pushes that land meanwhile only
# the newest waits to run next. A release is still gated on its own commit by
# the release workflow, whichever main runs were skipped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require committed Rust dependency lock
        run: test -f Cargo.lock || { echo "Cargo.lock must be committed; CI never resolves release dependencies implicitly" >&2; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src-tauri/resources/runtime-assets.json') }}
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e

  # The corpus, scored from the committed recording of what the worker read
  # and what the model replied: no runtime, no model, seconds. A change to
  # validation, evidence, distillation, or naming is measured here on every
  # push; a change to the prompt makes the recording stale, and the job says
  # so rather than scoring the wrong replies. See docs/evaluation.md.
  # InternBench is replayed the same way, from bench/recording.json against
  # bench/baseline.json, and needs no generated corpus: a document's bytes are
  # checked against bench/manifest.json. See docs/internbench.md.
  corpus-replay:
    name: Corpus replay against the recorded baseline (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-replay-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: npm ci
      - run: npm run fixtures
      - name: Replay the corpus and compare with the baseline
        run: >-
          cargo run --locked -p intern-engine --bin intern-evaluate --
          --fixtures fixtures/generated --expected fixtures/expected.json
          --replay fixtures/corpus-recording.json --baseline fixtures/corpus-baseline.json
          --output corpus-report.json
      - name: Replay InternBench and compare with its baseline
        if: always()
        run: >-
          cargo run --locked -p intern-bench --
          run --corpus bench/generated --gold bench/gold.json --manifest bench/manifest.json
          --replay bench/recording.json --baseline bench/baseline.json
          --output internbench-report.json --markdown internbench-report.md
      - name: Upload corpus reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            corpus-report.json
            internbench-report.json
            internbench-report.md
          if-no-files-found: ignore

  # Rust feedback in minutes rather than the Windows job's half hour: format,
  # Clippy with warnings denied, and the workspace tests. Code that only exists
  # on Windows (#[cfg(windows)]) is still compiled and linted only there, so
  # this job is the fast signal, not the last word.
  rust-ubuntu:
    name: Rust (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      # Every test binary links tauri, wry and webkit. Incremental state and
      # full debug info would multiply the target directory, which is both the
      # runner's disk and the cache entry saved below, and that entry competes
      # under the repository's cache limit with the Windows runtime-asset cache.
      # These are also the settings this job was proven green with.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      # The desktop crate links the system webview, tray, and SVG libraries
      # even to be type-checked.
      - name: Install the desktop shell's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Named for the settings above: an entry saved with incremental state and
          # debug info would otherwise be restored as an exact hit, and never
          # replaced, for as long as Cargo.lock stays the same.
          key: cargo-ubuntu-nodebug-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      # The generator uses nothing but Node itself, so no npm install.
      - name: Generate the clean-room fixtures the worker tests read
        run: node fixtures/generate-fixtures.mjs
      # Tauri's build script refuses to compile the desktop crate unless every
      # sidecar and resource it bundles exists. The Windows job below stages
      # the same placeholders under its own target triple.
      - name: Stage parser worker and placeholder sidecars for desktop compile checks
        run: |
          cargo build --locked -p intern-worker
          mkdir -p src-tauri/binaries src-tauri/resources/licenses src-tauri/resources/tessdata src-tauri/resources/native/pdfium src-tauri/resources/native/sidecars src-tauri/resources/ocr-models
          cp target/debug/intern-worker src-tauri/binaries/intern-worker-x86_64-unknown-linux-gnu
          install -m 755 /dev/null src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
          install -m 755 /dev/null src-tauri/binaries/tesseract-x86_64-unknown-linux-gnu
          touch src-tauri/resources/licenses/compile-placeholder.txt
          touch src-tauri/resources/tessdata/compile-placeholder.traineddata
          touch src-tauri/resources/native/pdfium/compile-placeholder.dll
          touch src-tauri/resources/native/sidecars/compile-placeholder.dll
          touch src-tauri/resources/ocr-models/compile-placeholder.onnx
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets

  windows-release-gates:
    name: Windows Rust, assets, E2E, and NSIS
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      INTERN_REQUIRE_GENERATED_FIXTURES: "1"
      INTERN_PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\native\pdfium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require committed Rust dependency lock
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath Cargo.lock -PathType Leaf)) { throw "Cargo.lock must be committed; CI never resolves release dependencies implicitly" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'src-tauri/resources/runtime-assets.json') }}
      # Restore and save separately, because actions/cache declares
      # `post-if: success()` and therefore saves nothing when a later step fails.
      # This step builds Tesseract from a pinned vcpkg baseline, and vcpkg pulls
      # each port's sources from GitHub archive URLs that have been returning 503
      # and curl error 56 - which vcpkg classifies as non-transient and refuses to
      # retry. Discarding every tarball on failure guaranteed the next run started
      # from zero against the same failing endpoint. Saving on failure means a run
      # keeps whatever it managed to fetch. Nothing here is trusted on the strength
      # of being cached: pinned downloads are still checked against their committed
      # size and SHA-256, and vcpkg verifies every archive against the baseline's
      # own hashes.
      #
      # The key is computed once, here, and the save steps reuse it. They used to
      # recompute hashFiles() after the fetch, which rewrites runtime-assets.json
      # in place (and records the freshly built worker's digest in it), so every
      # run saved ~470 MB under a key no restore would ever ask for, and rebuilt
      # Tesseract from nothing for 24 minutes. A complete cache is saved under
      # this key; a failed fetch saves its progress under a "-partial-" key of
      # its own, which the next run restores and then completes. A partial
      # cache saved under the primary key would instead be restored as a hit
      # for ever and never upgraded.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: assets-cache
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}
          restore-keys: runtime-assets-${{ runner.os }}-${{ hashFiles('src-tauri/resources/runtime-assets.json', 'scripts/fetch-windows-assets.ps1') }}-partial-
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Stage parser worker for desktop compile checks
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\debug\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType File src-tauri\binaries\llama-server-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType File src-tauri\binaries\tesseract-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\licenses -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\tessdata -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\pdfium -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\native\sidecars -Force | Out-Null
          New-Item -ItemType Directory src-tauri\resources\ocr-models -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\licenses\compile-placeholder.txt -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\tessdata\compile-placeholder.traineddata -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\pdfium\compile-placeholder.dll -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\native\sidecars\compile-placeholder.dll -Force | Out-Null
          New-Item -ItemType File src-tauri\resources\ocr-models\compile-placeholder.onnx -Force | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The default feature set never compiles the PDFium and Tesseract code, so
      # nothing had ever linted the paths that only run on a packaged Windows
      # install. Lint them here, where the crate is built with those features
      # anyway.
      - run: cargo clippy --locked -p intern-worker --all-targets --features windows-native -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Build parser worker sidecar
        shell: pwsh
        run: |
          cargo build --locked -p intern-worker --release --features windows-native
          New-Item -ItemType Directory src-tauri\binaries -Force | Out-Null
          Copy-Item target\release\intern-worker.exe src-tauri\binaries\intern-worker-x86_64-pc-windows-msvc.exe -Force
      - name: Fetch and verify pinned Windows assets
        id: fetch-assets
        shell: pwsh
        run: |
          Remove-Item src-tauri\resources\licenses\compile-placeholder.txt -Force
          Remove-Item src-tauri\resources\tessdata\compile-placeholder.traineddata -Force
          Remove-Item src-tauri\resources\native\pdfium\compile-placeholder.dll -Force
          Remove-Item src-tauri\resources\native\sidecars\compile-placeholder.dll -Force
          Remove-Item src-tauri\resources\ocr-models\compile-placeholder.onnx -Force
          ./scripts/fetch-windows-assets.ps1 -CacheDirectory "${{ runner.temp }}\intern-assets-cache"
      # A complete fetch is saved under the key the restore step looked for.
      # Skipped on an exact hit, where that key already exists.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.fetch-assets.outcome == 'success' && steps.assets-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}
      # A failed fetch still keeps what it managed to download, under a key of
      # its own: progress for the next run, never mistaken for a complete cache.
      # Not a cancelled one. Cancelling can stop the script mid-write, before it
      # can discard a truncated download, and the next run would restore that
      # file, skip downloading it because it exists, fail its pinned size and
      # SHA-256, and save it again as the newest partial: every later run would
      # fail the same way until the manifest or the fetch script changed.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.fetch-assets.outcome == 'failure'
        with:
          path: ${{ runner.temp }}\intern-assets-cache
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run assets:verify -- --require-bundled
      - name: Run generated-fixture parser integration with native assets
        run: cargo test --locked -p intern-worker --test generated_fixtures --features windows-native
      - name: Run package-shaped worker PDF/OCR integration
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "intern-runtime-stage"
          ./scripts/stage-windows-runtime.ps1 -Destination $Stage
          ./scripts/smoke-worker.ps1 -WorkerPath (Join-Path $Stage "intern-worker.exe") -RuntimeDirectory $Stage
      # The last unpinned network dependency in the build. See the script header:
      # the bundler fetches its own NSIS toolset at bundle time, and a connection
      # reset there failed two consecutive runs of the same commit.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\intern-nsis-cache
          key: nsis-toolset-${{ runner.os }}-${{ hashFiles('scripts/prefetch-nsis.ps1') }}
      - name: Stage the pinned NSIS toolset
        shell: pwsh
        run: ./scripts/prefetch-nsis.ps1 -CacheDirectory "${{ runner.temp }}\intern-nsis-cache"
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Smoke test per-user installer
        shell: pwsh
        run: |
          $Installer = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "NSIS installer was not produced" }
          ./scripts/smoke-installer.ps1 -InstallerPath $Installer.FullName
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intern-v0.1.0-alpha.11-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/resources/THIRD_PARTY_NOTICES.md
            src-tauri/resources/runtime-assets.json
