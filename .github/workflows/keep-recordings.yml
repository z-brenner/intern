name: Keep candidate-bench recordings

# One-off, on this branch only: copies the candidate-bench artifacts that
# hold the 9B's development and held-out recordings into the branch before
# they expire (14-day retention, the first on 2026-11-25), so the gate
# verifier experiment can read them. Gates nothing; never meant for main.
on:
  push:
    branches: [claude/project-thread-j987e5]
    paths: [.github/workflows/keep-recordings.yml]

permissions:
  contents: write
  actions: read

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-j987e5
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bench-data/recordings
          while read -r id name; do
            [ -z "$id" ] && continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "bench-data/recordings/${name}.zip"
            ls -la "bench-data/recordings/${name}.zip"
          done < .github/keep-recordings.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench-data/recordings
          git commit -m "bench-data: keep candidate-bench recordings before they expire"
          git push origin HEAD:claude/project-thread-j987e5
