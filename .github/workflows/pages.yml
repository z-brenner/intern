name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  # Publishing a release redeploys the page from the released commit, so the
  # download page a release links to exists and says what that release does,
  # even when no commit since the last deployment touched site/.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # The usual failure is a repository where Pages was never switched on,
      # and the actions' own errors ("Get Pages site failed", "Not Found") do
      # not say that. Say it, with the fix, where the run's summary shows it.
      - name: Explain how to enable Pages
        if: failure()
        run: |
          {
            echo '### The download page was not deployed'
            echo
            echo 'If the log above says Pages is not enabled, or the Pages site was not found:'
            echo
            echo '**Enable Pages: Settings → Pages → Source: GitHub Actions**, then run this workflow again.'
            echo
            echo 'If it says a tag is not allowed to deploy to github-pages (a run started by publishing a release), allow release tags under Settings → Environments → github-pages → Deployment branches and tags, or run this workflow from main.'
          } >> "$GITHUB_STEP_SUMMARY"
