name: Runtime speed on Windows

# The packaged llama.cpp runtime, upstream llama.cpp, on a Windows runner:
# the same 26 recorded InternBench requests replayed through it twice with the
# accurate tier's model, timed, and compared reply for reply with the reply
# the request got live. One more run puts the fast tier's model through it,
# for its speed alone: the requests were recorded for the accurate model, so
# its replies are compared with that capture but mean less. Until alpha.14
# it also timed the llama.cpp fork the package then carried.
# Laboratory measurement only: it gates nothing and publishes nothing. See
# bench/reports/speed-linux-cpu-2026-10-29.

# With probe set to memory it measures memory instead of speed: what each
# tier's loaded server takes out of Windows' available physical memory, and
# what stopping it gives back, set against the tier plan's arithmetic
# (scripts/probe-windows-memory.ps1, bench/reports/windows-memory-2026-11-09).

# Run by hand (Actions > Runtime speed on Windows > Run workflow): the speed
# run takes most of an hour of a Windows runner and the memory probe about
# 15 minutes, so no push or pull request starts either.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: What to measure
        required: false
        default: speed
        type: choice
        options:
          - speed
          - memory
          - no-repack
          - no-repack-fast

permissions:
  contents: read

concurrency:
  group: runtime-speed-${{ github.ref }}-${{ inputs.probe }}
  cancel-in-progress: true

jobs:
  windows-runtime-speed:
    name: Windows runtime speed (upstream llama.cpp, both tiers)
    if: inputs.probe != 'memory'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      UPSTREAM_VERSION: b11946
      UPSTREAM_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11946/llama-b11946-bin-win-cpu-x64.zip
      UPSTREAM_SHA256: 8a702bb07c873b133c56eb3acd92a48d7c5c9ad339c6435eddc5185e46e1a043
      REQUESTS: bench/reports/speed-linux-cpu-2026-10-29/requests
      # The recorded requests are UTF-8; Windows Python would read them as cp1252.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the pinned models and the runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          function Get-Pinned([string]$Url, [string]$Sha256, [string]$Path) {
            Invoke-WebRequest -Uri $Url -OutFile $Path
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($Actual -ne $Sha256) { throw "$Path has SHA-256 $Actual, not the pinned $Sha256" }
          }
          New-Item -ItemType Directory lab -Force | Out-Null
          $Manifest = Get-Content src-tauri/resources/model-manifest.json -Raw | ConvertFrom-Json
          foreach ($Tier in @("accurate", "fast")) {
            $Model = ($Manifest.models | Where-Object tier -eq $Tier).files | Where-Object role -eq "model"
            Get-Pinned $Model.url $Model.sha256 "lab\$Tier.gguf"
          }
          Get-Pinned $env:UPSTREAM_URL $env:UPSTREAM_SHA256 "lab\upstream.zip"
          Expand-Archive lab\upstream.zip lab\upstream
          [ordered]@{
            upstream = $env:UPSTREAM_VERSION
            cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
            logical_processors = [int]$env:NUMBER_OF_PROCESSORS
            # The app's own rule for its server's threads (server.rs default_threads):
            # every logical processor, between 2 and 8. Until alpha.18 this took
            # half of them, between 2 and 12, the app's rule only up to alpha.13:
            # two threads on a four-processor runner, where the app takes four.
            threads = [Math]::Max(2, [Math]::Min(8, [int]$env:NUMBER_OF_PROCESSORS))
          } | ConvertTo-Json | Set-Content lab\context.json -Encoding utf8NoBOM
          Get-Content lab\context.json
      - name: Replay the requests (accurate, fast, accurate again)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Threads = (Get-Content lab\context.json -Raw | ConvertFrom-Json).threads
          $Port = 18200
          # Each model's own flags, as the app adds them to its launch
          # (tiers::tier_server_flags in crates/intern-engine/src/tiers.rs).
          $TierFlags = @{ accurate = @("--no-repack"); fast = @("--no-repack") }
          $Runs = @(@("upstream", "accurate", "upstream-1"), @("upstream", "fast", "fast-1"), @("upstream", "accurate", "upstream-2"))
          $Every = 1
          # A model's own flag, alternated on one runner: the repacked runs
          # leave the tier's flags out, the no-repack runs pass them as the
          # app does (--no-repack, for both models).
          if ("${{ inputs.probe }}" -like "no-repack*") {
            $Tier = if ("${{ inputs.probe }}" -eq "no-repack-fast") { "fast" } else { "accurate" }
            $Runs = @(@("upstream", $Tier, "repacked-1", $false), @("upstream", $Tier, "no-repack-1", $true),
              @("upstream", $Tier, "repacked-2", $false), @("upstream", $Tier, "no-repack-2", $true))
            $Every = 3
          }
          foreach ($Run in $Runs) {
            $Runtime = $Run[0]; $Tier = $Run[1]; $Label = $Run[2]
            $Model = (Resolve-Path "lab\$Tier.gguf").Path
            $Server = @(Get-ChildItem -LiteralPath "lab\$Runtime" -Recurse -File -Filter "llama-server.exe")[0].FullName
            # The app's launch (server.rs arguments_for, its measured flags and
            # the tier's own), without the API key and the slot folder.
            $Arguments = @("--host", "127.0.0.1", "--port", "$Port", "--model", $Model,
              "--parallel", "1", "--ctx-size", "8192", "--n-gpu-layers", "0",
              "--threads", "$Threads", "--threads-batch", "$Threads", "--jinja", "--no-webui",
              "--cache-ram", "0", "-ub", "256", "--prio", "-1", "--poll", "0", "--no-mmproj")
            if ($Run.Count -lt 4 -or $Run[3]) { $Arguments += $TierFlags[$Tier] }
            $Process = Start-Process -FilePath $Server -ArgumentList $Arguments -PassThru -NoNewWindow `
              -RedirectStandardOutput "lab\$Label-server.out.log" -RedirectStandardError "lab\$Label-server.log"
            $Healthy = $false
            for ($i = 0; $i -lt 480; $i++) {
              try {
                if ((Invoke-WebRequest -Uri "http://127.0.0.1:$Port/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $Healthy = $true; break }
              } catch { }
              if ($Process.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $Healthy) { Get-Content "lab\$Label-server.log" -Tail 40; throw "$Runtime llama-server did not become healthy" }
            python scripts/bonsai-eval/replay-requests.py --server "http://127.0.0.1:$Port" --wire $env:REQUESTS `
              --skip-first --warm-up --every $Every --reference $env:REQUESTS --out "lab\$Label.json"
            if ($LASTEXITCODE -ne 0) { throw "The replay against $Runtime failed" }
            Stop-Process -Id $Process.Id -Force
            Start-Sleep -Seconds 3
          }
      - name: Summarize
        if: always() && hashFiles('lab/context.json') != ''
        shell: pwsh
        run: |
          @'
          import glob, json, os
          context = json.load(open("lab/context.json", encoding="utf-8-sig"))
          lines = [f"Windows runner: {context['cpu']}, {context['logical_processors']} logical processors, "
                   f"{context['threads']} server threads; upstream {context['upstream']}",
                   "", "upstream-N run the accurate model; fast-1 runs the fast one, "
                   "against requests recorded for the accurate model, so its time means most.",
                   "", "| Run | Time per document | Prefill (median) | Decode (median) | Replies identical to the Linux capture |",
                   "| --- | ---: | ---: | ---: | ---: |"]
          for path in sorted(glob.glob("lab/*-[12].json")):
              s = json.load(open(path))["summary"]
              lines.append(f"| {os.path.basename(path)[:-5]} | {s['wall_per_request_s']} s | {s['prompt_ms_p50'] / 1000:.1f} s | "
                           f"{s['predicted_ms_p50'] / 1000:.1f} s | {s['identical_to_reference']}/{s['compared_with_reference']} |")
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text + "\n")
          '@ | python -
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-speed-windows
          path: |
            lab/*.json
            lab/*.log
          retention-days: 30

  windows-memory:
    name: Windows memory probe (available memory against the loaded server's working set)
    if: inputs.probe == 'memory'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UPSTREAM_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11946/llama-b11946-bin-win-cpu-x64.zip
      UPSTREAM_SHA256: 8a702bb07c873b133c56eb3acd92a48d7c5c9ad339c6435eddc5185e46e1a043
      REQUESTS: bench/reports/speed-linux-cpu-2026-10-29/requests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch both pinned models and the upstream runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          function Get-Pinned([string]$Url, [string]$Sha256, [string]$Path) {
            Invoke-WebRequest -Uri $Url -OutFile $Path
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($Actual -ne $Sha256) { throw "$Path has SHA-256 $Actual, not the pinned $Sha256" }
          }
          New-Item -ItemType Directory lab -Force | Out-Null
          $Manifest = Get-Content src-tauri/resources/model-manifest.json -Raw | ConvertFrom-Json
          foreach ($Tier in @("accurate", "fast")) {
            $Model = ($Manifest.models | Where-Object tier -eq $Tier).files | Where-Object role -eq "model"
            Get-Pinned $Model.url $Model.sha256 "lab\$Tier.gguf"
          }
          Get-Pinned $env:UPSTREAM_URL $env:UPSTREAM_SHA256 "lab\upstream.zip"
          Expand-Archive lab\upstream.zip lab\upstream
          Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize, CurrentUsage | Format-List
      # Twice: on the runner as it comes, and with 2 GiB held by another
      # process, as a laptop with a browser open has less available.
      - name: Probe memory (accurate, then fast)
        shell: pwsh
        run: |
          $Server = @(Get-ChildItem -LiteralPath lab\upstream -Recurse -File -Filter "llama-server.exe")[0].FullName
          ./scripts/probe-windows-memory.ps1 -Server $Server -Accurate lab\accurate.gguf -Fast lab\fast.gguf `
            -Requests $env:REQUESTS -Tiers crates/intern-engine/src/tiers.rs -Out lab\memory
      - name: Probe memory with 2 GiB held by another process
        shell: pwsh
        run: |
          $Server = @(Get-ChildItem -LiteralPath lab\upstream -Recurse -File -Filter "llama-server.exe")[0].FullName
          ./scripts/probe-windows-memory.ps1 -Server $Server -Accurate lab\accurate.gguf -Fast lab\fast.gguf `
            -Requests $env:REQUESTS -Tiers crates/intern-engine/src/tiers.rs -Out lab\memory-balloon -BalloonMiB 2048
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-memory-probe
          path: |
            lab/memory/
            lab/memory-balloon/
          retention-days: 30
