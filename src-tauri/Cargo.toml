[package]
name = "intern-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "intern_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "intern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
intern-core = { path = "../crates/intern-core" }
intern-engine = { path = "../crates/intern-engine" }
intern-intake = { path = "../crates/intern-intake" }
intern-queue = { path = "../crates/intern-queue" }
# The hosted model's API key lives in the operating system's credential store
# (Windows Credential Manager, the macOS Keychain, the desktop's Secret
# Service on Linux), never in settings.json. On Linux that is the one store
# that survives signing out, the kernel keyring does not; it is reached over
# the D-Bus that tao already links, with the secret encrypted in transit by
# pure-Rust crypto rather than OpenSSL.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# Jitter for the hosted model's retry wait. Already built for intern-engine.
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.4.0"
# One Intern per machine. A second process starts a second local model, a
# second intake watcher, and a second tray against the same queue database.
# Pinned exactly, like the updater: 2.4.4 is the current release built against
# the tauri 2.x this app pins, and a floating range on a Tauri plugin is how
# the crate and its npm package drift apart and fail a release build.
tauri-plugin-single-instance = "=2.4.4"
# The Help & support link hands one URL to the system browser. Scoped in
# capabilities/default.json to the published guide alone, so the webview
# cannot ask the shell to open anything else.
tauri-plugin-opener = "=2.5.5"
# Pinned exactly, and kept in lockstep with @tauri-apps/plugin-updater in
# package.json. Tauri refuses to build when a plugin's Rust crate and npm
# package differ in major/minor, and a caret range let the crate float to 2.10.1
# against an npm 2.9.0 that had been pinned exactly - which failed the release
# with "Found version mismatched Tauri packages". Change both or neither.
tauri-plugin-updater = "=2.10.1"
url = "=2.5.8"

[dev-dependencies]
